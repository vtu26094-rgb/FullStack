# ==========================================
#  Job Portal - Application Configuration
# ==========================================

spring.application.name=job-portal

# --- H2 In-Memory Database (default for easy local run) ---
spring.datasource.url=jdbc:h2:mem:jobportaldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- MySQL (uncomment and configure to use MySQL instead) ---
# spring.datasource.url=jdbc:mysql://localhost:3306/jobportal?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=yourpassword

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# For MySQL use: spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# --- Thymeleaf ---
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# --- File Upload (resume) ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
file.upload.dir=uploads/resumes

# --- Server ---
server.port=8081
server.error.whitelabel.enabled=false

# --- Affinda Resume Parser API ---
# Get your API key from https://www.affinda.com/
affinda.api.key=${AFFINDA_API_KEY:REPLACE_WITH_YOUR_KEY}
affinda.api.url=https://api.affinda.com/v3/resumes

