<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>My Profile – Job Portal</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="app-layout">

    <aside class="sidebar">
        <div class="sidebar-brand">
            <h2>Job Portal</h2>
            <span>Student</span>
        </div>
        <nav class="sidebar-nav">
            <a th:href="@{/student/dashboard}">
                <span class="nav-icon">&#9632;</span> Dashboard
            </a>
            <a th:href="@{/student/profile}" class="active">
                <span class="nav-icon">&#9633;</span> My Profile
            </a>
            <a th:href="@{/student/jobs}">
                <span class="nav-icon">&#9670;</span> Browse Jobs
            </a>
            <a th:href="@{/student/applications}">
                <span class="nav-icon">&#9654;</span> My Applications
            </a>
                    <a th:href="@{/notifications}">
                <span class="nav-icon">&#128276;</span> Notifications
                <span class="badge" style="background: red; color: white; border-radius: 50%; padding: 2px 6px; font-size: 12px;" th:if="${unreadNotificationsCount != null and unreadNotificationsCount > 0}" th:text="${unreadNotificationsCount}"></span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <a th:href="@{/logout}">&#10006; Sign Out</a>
        </div>
    </aside>

    <div class="main-content">
        <div class="topbar">
            <h3>My Profile</h3>
            <span class="user-info" th:text="${student.username}">username</span>
        </div>

        <div class="page-content">
            <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
            <div class="alert alert-danger"  th:if="${error}"   th:text="${error}"></div>

            <div class="profile-grid">
                <!-- Left Sidebar: Photo and Summary -->
                <div class="profile-sidebar">
                    <div class="card">
                        <div class="profile-photo-container">
                            <img th:if="${student.photoPath != null}" th:src="@{'/uploads/photos/' + ${student.photoPath}}" alt="Profile Photo" class="profile-photo"/>
                            <div th:if="${student.photoPath == null}" class="profile-photo-placeholder" th:text="${#strings.substring(student.name, 0, 1).toUpperCase()}">U</div>
                            
                            <h3 class="profile-name" th:text="${student.name}">Name</h3>
                            <p class="profile-username" th:text="'@' + ${student.username}">@user</p>

                            <form method="post" th:action="@{/student/profile/photo}" enctype="multipart/form-data">
                                <div class="form-group" style="margin-bottom: 8px;">
                                    <input type="file" name="photo" class="form-control" accept="image/*" required style="font-size: .75rem; padding: 6px;"/>
                                </div>
                                <button type="submit" class="btn btn-outline btn-sm btn-block">Upload New Photo</button>
                            </form>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header"><h4>Resume</h4></div>
                        <div class="card-body">
                            <div th:if="${student.resumePath != null}" style="margin-bottom:12px;">
                                <span class="badge badge-green">Uploaded</span>
                                <span class="text-muted" style="display:block; margin-top:6px; font-size: 0.75rem; word-break: break-all;" th:text="${student.resumePath}">filename</span>
                            </div>
                            <div th:if="${student.resumePath == null}" style="margin-bottom:12px;">
                                <span class="badge badge-amber">No resume</span>
                            </div>
                            <form method="post" th:action="@{/student/profile/resume}" enctype="multipart/form-data">
                                <div class="form-group" style="margin-bottom:8px;">
                                    <input class="form-control" type="file" name="resume" accept=".pdf,.doc,.docx" required style="font-size: .75rem; padding: 6px;"/>
                                </div>
                                <button type="submit" class="btn btn-success btn-sm btn-block">Upload Resume</button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Right Main Content: Editable details -->
                <div class="profile-main">
                    <form method="post" th:action="@{/student/profile}" th:object="${profileDto}" onsubmit="prepareSubmit()">
                        
                        <div class="card section-card mb-16">
                            <div class="card-header"><h4>Personal Details</h4></div>
                            <div class="card-body">
                                <div class="form-row">
                                    <div class="form-group">
                                        <label class="form-label" for="profName">Full Name</label>
                                        <input id="profName" class="form-control" type="text" th:field="*{name}" required/>
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label" for="profEmail">Email</label>
                                        <input id="profEmail" class="form-control" type="email" th:field="*{email}" required/>
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label" for="profPhone">Phone Number</label>
                                        <input id="profPhone" class="form-control" type="text" th:field="*{phone}"/>
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label" for="profAge">Age</label>
                                        <input id="profAge" class="form-control" type="number" th:field="*{age}"/>
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label" for="profGender">Gender</label>
                                        <select id="profGender" class="form-control form-select" th:field="*{gender}">
                                            <option value="">Select Gender</option>
                                            <option value="Male">Male</option>
                                            <option value="Female">Female</option>
                                            <option value="Other">Other</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="card section-card mb-16">
                            <div class="card-header"><h4>Educational History</h4></div>
                            <div class="card-body">
                                <div id="education-container"></div>
                                <button type="button" class="btn btn-outline btn-sm mt-8" onclick="addEducation()">+ Add Another College</button>

                                <input type="hidden" th:field="*{collegeName}" id="hiddenCollegeName"/>
                                <input type="hidden" th:field="*{collegePercentage}" id="hiddenCollegePercentage"/>

                                <hr style="margin: 16px 0; border: 0; border-top: 1px solid var(--gray-200);"/>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label class="form-label" for="tenthMarks">10th Details (Marks/GPA)</label>
                                        <input id="tenthMarks" class="form-control" type="text" th:field="*{tenthMarks}" placeholder="e.g. 90% or 9.5 CGPA"/>
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label" for="twelfthMarks">12th Details (Marks/GPA)</label>
                                        <input id="twelfthMarks" class="form-control" type="text" th:field="*{twelfthMarks}" placeholder="e.g. 85% or 8.8 CGPA"/>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="card section-card">
                            <div class="card-header"><h4>Professional Overview</h4></div>
                            <div class="card-body">
                                <div class="form-group">
                                    <label class="form-label" for="profSkills">Key Skills</label>
                                    <input id="profSkills" class="form-control" type="text" th:field="*{skills}" placeholder="e.g. Java, Python, React"/>
                                </div>

                                <hr style="margin: 16px 0; border: 0; border-top: 1px solid var(--gray-200);"/>
                                <div id="experience-container"></div>
                                <button type="button" class="btn btn-outline btn-sm mt-8" onclick="addExperience()">+ Add Another Company</button>

                                <input type="hidden" th:field="*{experienceCompany}" id="hiddenExpCompany"/>
                                <input type="hidden" th:field="*{experienceYears}" id="hiddenExpYears"/>
                                
                                <div class="mt-16" style="text-align: right;">
                                    <button type="submit" class="btn btn-primary" style="padding: 10px 24px;">Save Profile Profile</button>
                                </div>
                            </div>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script th:inline="javascript">
    const initCollegesStr = [[${profileDto.collegeName != null ? profileDto.collegeName : ''}]];
    const initCollegesPctStr = [[${profileDto.collegePercentage != null ? profileDto.collegePercentage : ''}]];
    const initExpCoStr = [[${profileDto.experienceCompany != null ? profileDto.experienceCompany : ''}]];
    const initExpYrStr = [[${profileDto.experienceYears != null ? profileDto.experienceYears : ''}]];

    const initColleges = initCollegesStr ? initCollegesStr.split('||') : [];
    const initCollegesPct = initCollegesPctStr ? initCollegesPctStr.split('||') : [];
    const initExpCo = initExpCoStr ? initExpCoStr.split('||') : [];
    const initExpYr = initExpYrStr ? initExpYrStr.split('||') : [];

    function addEducation(name = '', pct = '') {
        const div = document.createElement('div');
        div.className = 'dynamic-row';
        div.style.display = 'flex';
        div.style.gap = '12px';
        div.style.marginBottom = '12px';
        div.style.alignItems = 'flex-end';
        div.innerHTML = `
            <div class="form-group" style="flex: 1; margin-bottom: 0;">
                <label class="form-label">College / University Name</label>
                <input class="form-control dyn-clg-name" type="text" value="${name}" placeholder="e.g. ABC Institute"/>
            </div>
            <div class="form-group" style="flex: 1; margin-bottom: 0;">
                <label class="form-label">Percentage / CGPA</label>
                <input class="form-control dyn-clg-pct" type="text" value="${pct}" placeholder="e.g. 85%"/>
            </div>
            <button type="button" class="btn btn-outline text-red" style="padding: 8px 12px; height: 38px; border-color: #fee2e2;" onclick="this.parentElement.remove()" title="Remove">×</button>
        `;
        document.getElementById('education-container').appendChild(div);
    }

    function addExperience(co = '', yr = '') {
        const div = document.createElement('div');
        div.className = 'dynamic-row';
        div.style.display = 'flex';
        div.style.gap = '12px';
        div.style.marginBottom = '12px';
        div.style.alignItems = 'flex-end';
        div.innerHTML = `
            <div class="form-group" style="flex: 1; margin-bottom: 0;">
                <label class="form-label">Experience: Company Name</label>
                <input class="form-control dyn-exp-co" type="text" value="${co}" placeholder="e.g. XYZ Corp"/>
            </div>
            <div class="form-group" style="flex: 1; margin-bottom: 0;">
                <label class="form-label">Years of Experience</label>
                <input class="form-control dyn-exp-yr" type="text" value="${yr}" placeholder="e.g. 2 Years"/>
            </div>
            <button type="button" class="btn btn-outline text-red" style="padding: 8px 12px; height: 38px; border-color: #fee2e2;" onclick="this.parentElement.remove()" title="Remove">×</button>
        `;
        document.getElementById('experience-container').appendChild(div);
    }

    window.onload = function() {
        if(initColleges.length > 0) {
            for(let i=0; i<initColleges.length; i++) {
                addEducation(initColleges[i], initCollegesPct[i] || '');
            }
        } else {
            addEducation();
        }

        if(initExpCo.length > 0) {
            for(let i=0; i<initExpCo.length; i++) {
                addExperience(initExpCo[i], initExpYr[i] || '');
            }
        } else {
            addExperience();
        }
    }

    function prepareSubmit() {
        const clgNames = Array.from(document.querySelectorAll('.dyn-clg-name')).map(el => el.value).join('||');
        const clgPcts = Array.from(document.querySelectorAll('.dyn-clg-pct')).map(el => el.value).join('||');
        const expCos = Array.from(document.querySelectorAll('.dyn-exp-co')).map(el => el.value).join('||');
        const expYrs = Array.from(document.querySelectorAll('.dyn-exp-yr')).map(el => el.value).join('||');
        
        document.getElementById('hiddenCollegeName').value = clgNames;
        document.getElementById('hiddenCollegePercentage').value = clgPcts;
        document.getElementById('hiddenExpCompany').value = expCos;
        document.getElementById('hiddenExpYears').value = expYrs;
    }
</script>
</body>
</html>
