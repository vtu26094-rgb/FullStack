<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Error – Job Portal</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="auth-page">
    <div class="auth-card" style="text-align:center;">
        <h1 style="font-size:3rem;color:#dc2626;margin-bottom:8px;">&#9888;</h1>
        <h2 th:text="${errorTitle != null ? errorTitle : 'Oops!'}"
            style="color:#111827;margin-bottom:12px;">Error</h2>
        <p style="color:#6b7280;margin-bottom:24px;"
           th:text="${errorMessage != null ? errorMessage : 'Something went wrong. Please try again.'}">
            Error message here.
        </p>
        <a href="javascript:history.back()" class="btn btn-outline" style="margin-right:8px;">Go Back</a>
        <a href="/" class="btn btn-primary">Home</a>
    </div>
</div>
</body>
</html>
