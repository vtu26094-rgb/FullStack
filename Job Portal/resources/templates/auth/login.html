<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login – Job Portal</title>
    <meta name="description" content="Sign in to the Job Portal Management System"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <div class="brand">
            <h1>Job Portal</h1>
            <p>Sign in to your account</p>
        </div>

        <!-- Success flash (after registration) -->
        <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
        <div class="alert alert-success" th:if="${logoutMsg}" th:text="${logoutMsg}"></div>
        <div class="alert alert-danger"  th:if="${loginError}" th:text="${loginError}"></div>

        <form method="post" th:action="@{/login}">
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input id="username" class="form-control" type="text" name="username"
                       placeholder="Enter your username" required autofocus/>
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input id="password" class="form-control" type="password" name="password"
                       placeholder="Enter your password" required/>
            </div>
            <button id="loginBtn" type="submit" class="btn btn-primary btn-block">Sign In</button>
        </form>

        <p style="text-align:center;margin-top:20px;font-size:.875rem;color:#6b7280;">
            Don't have an account?
            <a th:href="@{/register}">Register here</a>
        </p>


    </div>
</div>
</body>
</html>
